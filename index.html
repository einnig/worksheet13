<!DOCTYPE html>
<html lang="is">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Target Words - Worksheet 13</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            text-align: center; 
            background-color: #f0f4f8; 
            margin: 0;
            padding: 2vh 5vw; 
            min-height: 95vh; 
            display: flex;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
        }
        .container { 
            width: 100%; 
            max-width: 1200px; 
            background: white; 
            padding: 30px 40px; 
            border-radius: 20px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.1); 
            max-height: 100%;
            overflow-y: auto;
        }
        h1 {
            color: #1a73e8;
            font-size: 2em;
            margin-top: 0;
            margin-bottom: 15px;
        }
        /* Framvindustika */
        .progress-container {
            width: 100%;
            background-color: #e0e0e0;
            border-radius: 10px;
            margin-bottom: 20px;
            height: 20px;
        }
        #progress-bar {
            height: 100%;
            width: 0%;
            background-color: #34a853;
            border-radius: 10px;
            transition: width 0.5s ease-in-out;
        }
        
        #counter { font-size: 1.2em; color: #666; font-weight: bold; margin-bottom: 10px; }

        #target { 
            font-size: 4em; 
            margin: 10px 0; 
            color: #222; 
            font-weight: bold;
        }
        
        #is-explanation {
            font-size: 1.2em;
            color: #333;
            background-color: #e8f0fe;
            padding: 15px 25px;
            border-radius: 10px;
            display: inline-block;
            margin-bottom: 20px;
            max-width: 80%;
            line-height: 1.6;
            text-align: left;
        }

        .btn { 
            padding: 12px 25px; 
            font-size: 1.2em; 
            margin: 5px; 
            cursor: pointer; 
            border: none; 
            border-radius: 8px; 
            background-color: #1a73e8; 
            color: white; 
            transition: 0.3s; 
            font-weight: bold;
        }
        .btn:hover:not(:disabled) { background-color: #1557b0; transform: scale(1.02); }
        .recording { background-color: #d93025; animation: pulse 1.5s infinite; }
        .recording:hover { background-color: #b3140b; }
        
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        #media-box { 
            margin-top: 25px;
            padding: 15px;
            border-radius: 12px;
            background-color: #f8fbff;
            border: 2px solid #e0e0e0;
        }
        
        .trans-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: center;
        }
        
        .trans-item {
            background: white;
            padding: 10px 15px;
            border-radius: 8px;
            border: 1px solid #cce0ff;
            font-size: 1.15em;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        #spoken {
            margin-top: 15px; 
            font-size: 1.4em;
            font-style: italic; 
            color: #555;
        }
        #result {
            font-weight: bold; 
            font-size: 1.8em; 
            margin-top: 5px; 
            color: #1a73e8;
        }
        .nav-btns { margin-top: 30px; }
        
        /* Fyrir nafnainnslátt */
        #studentName {
            font-size: 1.5em;
            padding: 10px;
            margin: 20px 0;
            width: 80%;
            max-width: 400px;
            border: 2px solid #1a73e8;
            border-radius: 8px;
            text-align: center;
        }

        .feedback-note {
            margin-top: 40px;
            font-size: 0.95em;
            color: #555;
            padding-top: 15px;
            border-top: 1px solid #ddd;
        }
        .feedback-note a {
            color: #1a73e8;
            text-decoration: none;
            font-weight: bold;
        }
        .feedback-note a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="container" id="app">
    <h1>Target Words - Worksheet 13</h1>
    
    <div class="progress-container">
        <div id="progress-bar"></div>
    </div>

    <div id="counter"></div>
    
    <div id="target"></div>
    <div id="is-explanation"></div>
    <br>
    
    <button id="record-btn" class="btn" onclick="toggleRecord()">🎤 Tala (Speak)</button>
    
    <div id="spoken"></div>
    <div id="result"></div>

    <div id="media-box"></div>

    <div class="nav-btns">
        <button class="btn" style="background-color: #5f6368;" onclick="prevExercise()">⬅️ Fyrri (Previous)</button>
        <button class="btn" style="background-color: #5f6368;" onclick="nextExercise()">Næsta (Next) ➡️</button>
    </div>

    <div class="feedback-note">
        Vinsamlegast sendið ábendingar á <a href="mailto:dgu@fb.is">dgu@fb.is</a>
    </div>
</div>

<script>
const exerciseData = [
    { text: "Future", is_exp: "<b>Íslenska:</b> Framtíð<br><b>English:</b> Time yet to come<br><b>Dæmi:</b> We are going to travel in the <b>future</b>.", translations: { "Arabíska": "مستقبل", "Portúgalska": "Futuro", "Persneska": "آینده", "Spænska": "Futuro", "Víetnamska": "Tương lai", "Úkraínska": "Майбутнє", "Rússneska": "Будущее", "Pólska": "Przyszłość" } },
    { text: "Plans", is_exp: "<b>Íslenska:</b> Áætlanir / Plön<br><b>English:</b> Intentions or ideas for the future<br><b>Dæmi:</b> Do you have any <b>plans</b> for the weekend?", translations: { "Arabíska": "خطط", "Portúgalska": "Planos", "Persneska": "برنامه‌ها", "Spænska": "Planes", "Víetnamska": "Kế hoạch", "Úkraínska": "Плани", "Rússneska": "Планы", "Pólska": "Plany" } },
    { text: "Arrangements", is_exp: "<b>Íslenska:</b> Fyrirkomulag / Ráðstafanir<br><b>English:</b> Preparations or plans<br><b>Dæmi:</b> We made <b>arrangements</b> for the trip.", translations: { "Arabíska": "ترتيبات", "Portúgalska": "Preparativos", "Persneska": "ترتیبات", "Spænska": "Preparativos", "Víetnamska": "Sự sắp xếp", "Úkraínska": "Домовленості", "Rússneska": "Договоренности", "Pólska": "Ustalenia" } },
    { text: "Intentions", is_exp: "<b>Íslenska:</b> Áform / Fyrirætlanir<br><b>English:</b> Goals / What you plan to do<br><b>Dæmi:</b> Her <b>intentions</b> are good.", translations: { "Arabíska": "نوايا", "Portúgalska": "Intenções", "Persneska": "مقاصد", "Spænska": "Intenciones", "Víetnamska": "Ý định", "Úkraínska": "Наміри", "Rússneska": "Намерения", "Pólska": "Zamiary" } },
    { text: "Predictions", is_exp: "<b>Íslenska:</b> Spár<br><b>English:</b> Guesses about the future<br><b>Dæmi:</b> He makes <b>predictions</b> about the weather.", translations: { "Arabíska": "تنبؤات", "Portúgalska": "Previsões", "Persneska": "پیش‌بینی‌ها", "Spænska": "Predicciones", "Víetnamska": "Dự đoán", "Úkraínska": "Прогнози", "Rússneska": "Прогнозы", "Pólska": "Przewidywania" } },

    { text: "Tonight", is_exp: "<b>Íslenska:</b> Í kvöld<br><b>English:</b> This coming evening<br><b>Dæmi:</b> Are you going out <b>tonight</b>?", translations: { "Arabíska": "الليلة", "Portúgalska": "Hoje à noite", "Persneska": "امشب", "Spænska": "Esta noche", "Víetnamska": "Tối nay", "Úkraínska": "Сьогодні ввечері", "Rússneska": "Сегодня вечером", "Pólska": "Dziś wieczorem" } },
    { text: "Weekend", is_exp: "<b>Íslenska:</b> Helgi<br><b>English:</b> Saturday and Sunday<br><b>Dæmi:</b> Have a great <b>weekend</b>!", translations: { "Arabíska": "عطلة نهاية الأسبوع", "Portúgalska": "Fim de semana", "Persneska": "آخر هفته", "Spænska": "Fin de semana", "Víetnamska": "Cuối tuần", "Úkraínska": "Вихідні", "Rússneska": "Выходные", "Pólska": "Weekend" } },
    { text: "Afternoon", is_exp: "<b>Íslenska:</b> Eftirmiðdagur<br><b>English:</b> Time between noon and evening<br><b>Dæmi:</b> Let's meet in the <b>afternoon</b>.", translations: { "Arabíska": "بعد الظهر", "Portúgalska": "Tarde", "Persneska": "بعد از ظهر", "Spænska": "Tarde", "Víetnamska": "Buổi chiều", "Úkraínska": "Друга половина дня", "Rússneska": "Вторая половина дня", "Pólska": "Popołudnie" } },
    { text: "Grammar", is_exp: "<b>Íslenska:</b> Málfræði<br><b>English:</b> The rules of a language<br><b>Dæmi:</b> English <b>grammar</b> can be tricky.", translations: { "Arabíska": "قواعد", "Portúgalska": "Gramática", "Persneska": "گرامر", "Spænska": "Gramática", "Víetnamska": "Ngữ pháp", "Úkraínska": "Граматика", "Rússneska": "Грамматика", "Pólska": "Gramatyka" } },
    { text: "Listening", is_exp: "<b>Íslenska:</b> Hlustun<br><b>English:</b> Paying attention to sound<br><b>Dæmi:</b> We did a <b>listening</b> exercise in class.", translations: { "Arabíska": "استماع", "Portúgalska": "Escuta", "Persneska": "گوش دادن", "Spænska": "Escucha", "Víetnamska": "Nghe", "Úkraínska": "Слухання", "Rússneska": "Слушание", "Pólska": "Słuchanie" } },
    { text: "Comprehension", is_exp: "<b>Íslenska:</b> Skilningur<br><b>English:</b> Understanding<br><b>Dæmi:</b> Reading <b>comprehension</b> is important.", translations: { "Arabíska": "فهم", "Portúgalska": "Compreensão", "Persneska": "درک مطلب", "Spænska": "Comprensión", "Víetnamska": "Đọc hiểu", "Úkraínska": "Розуміння", "Rússneska": "Понимание", "Pólska": "Rozumienie" } },
    { text: "Reading", is_exp: "<b>Íslenska:</b> Lestur<br><b>English:</b> Looking at and understanding text<br><b>Dæmi:</b> <b>Reading</b> books helps you learn.", translations: { "Arabíska": "قراءة", "Portúgalska": "Leitura", "Persneska": "خواندن", "Spænska": "Lectura", "Víetnamska": "Đọc", "Úkraínska": "Читання", "Rússneska": "Чтение", "Pólska": "Czytanie" } },
    { text: "Statement", is_exp: "<b>Íslenska:</b> Fullyrðing / Yfirlýsing<br><b>English:</b> A clear expression of something<br><b>Dæmi:</b> Is this <b>statement</b> true or false?", translations: { "Arabíska": "عبارة", "Portúgalska": "Afirmação", "Persneska": "بیانیه", "Spænska": "Declaración", "Víetnamska": "Lời tuyên bố", "Úkraínska": "Твердження", "Rússneska": "Утверждение", "Pólska": "Twierdzenie" } },
    { text: "True", is_exp: "<b>Íslenska:</b> Satt / Rétt<br><b>English:</b> Correct or real<br><b>Dæmi:</b> The story is completely <b>true</b>.", translations: { "Arabíska": "صحيح", "Portúgalska": "Verdadeiro", "Persneska": "درست", "Spænska": "Verdadero", "Víetnamska": "Đúng", "Úkraínska": "Правда", "Rússneska": "Правда", "Pólska": "Prawda" } },
    { text: "False", is_exp: "<b>Íslenska:</b> Ósatt / Rangt<br><b>English:</b> Incorrect or not real<br><b>Dæmi:</b> That information is <b>false</b>.", translations: { "Arabíska": "خطأ", "Portúgalska": "Falso", "Persneska": "غلط", "Spænska": "Falso", "Víetnamska": "Sai", "Úkraínska": "Хибно", "Rússneska": "Ложь", "Pólska": "Fałsz" } },
    { text: "Library", is_exp: "<b>Íslenska:</b> Bókasafn<br><b>English:</b> A place with books to borrow<br><b>Dæmi:</b> We are meeting at the <b>library</b>.", translations: { "Arabíska": "مكتبة", "Portúgalska": "Biblioteca", "Persneska": "کتابخانه", "Spænska": "Biblioteca", "Víetnamska": "Thư viện", "Úkraínska": "Бібліотека", "Rússneska": "Библиотека", "Pólska": "Biblioteka" } },
    { text: "Project", is_exp: "<b>Íslenska:</b> Verkefni<br><b>English:</b> A task or assignment<br><b>Dæmi:</b> We are working on a history <b>project</b>.", translations: { "Arabíska": "مشروع", "Portúgalska": "Projeto", "Persneska": "پروژه", "Spænska": "Proyecto", "Víetnamska": "Dự án", "Úkraínska": "Проект", "Rússneska": "Проект", "Pólska": "Projekt" } },
    { text: "Match", is_exp: "<b>Íslenska:</b> Leikur / Viðureign<br><b>English:</b> A game or sports competition<br><b>Dæmi:</b> It is an important basketball <b>match</b>.", translations: { "Arabíska": "مباراة", "Portúgalska": "Partida", "Persneska": "مسابقه", "Spænska": "Partido", "Víetnamska": "Trận đấu", "Úkraínska": "Матч", "Rússneska": "Матч", "Pólska": "Mecz" } },
    { text: "Party", is_exp: "<b>Íslenska:</b> Partý / Veisla<br><b>English:</b> A social gathering or celebration<br><b>Dæmi:</b> My school is having a big <b>party</b>.", translations: { "Arabíska": "حفلة", "Portúgalska": "Festa", "Persneska": "مهمانی", "Spænska": "Fiesta", "Víetnamska": "Bữa tiệc", "Úkraínska": "Вечірка", "Rússneska": "Вечеринка", "Pólska": "Impreza" } },
    { text: "Clouds", is_exp: "<b>Íslenska:</b> Ský<br><b>English:</b> White or gray shapes in the sky<br><b>Dæmi:</b> Look at those dark <b>clouds</b>!", translations: { "Arabíska": "غيوم", "Portúgalska": "Nuvens", "Persneska": "ابرها", "Spænska": "Nubes", "Víetnamska": "Những đám mây", "Úkraínska": "Хмари", "Rússneska": "Облака", "Pólska": "Chmury" } },
    { text: "Rain", is_exp: "<b>Íslenska:</b> Rigning / Að rigna<br><b>English:</b> Water falling from the sky<br><b>Dæmi:</b> It is going to <b>rain</b> soon.", translations: { "Arabíska": "مطر", "Portúgalska": "Chuva", "Persneska": "باران", "Spænska": "Lluvia", "Víetnamska": "Mưa", "Úkraínska": "Дощ", "Rússneska": "Дождь", "Pólska": "Deszcz" } },
    { text: "Homework", is_exp: "<b>Íslenska:</b> Heimavinna<br><b>English:</b> Schoolwork done at home<br><b>Dæmi:</b> I need to finish my <b>homework</b>.", translations: { "Arabíska": "واجب منزلي", "Portúgalska": "Lição de casa", "Persneska": "تکلیف شب", "Spænska": "Tarea", "Víetnamska": "Bài tập về nhà", "Úkraínska": "Домашнє завдання", "Rússneska": "Домашнее задание", "Pólska": "Praca domowa" } },
    { text: "Mountains", is_exp: "<b>Íslenska:</b> Fjöll<br><b>English:</b> High, rocky landmasses<br><b>Dæmi:</b> We are taking the bus to the <b>mountains</b>.", translations: { "Arabíska": "جبال", "Portúgalska": "Montanhas", "Persneska": "کوه‌ها", "Spænska": "Montañas", "Víetnamska": "Ngọn núi", "Úkraínska": "Гори", "Rússneska": "Горы", "Pólska": "Góry" } },
    { text: "Cabin", is_exp: "<b>Íslenska:</b> Sumarbústaður / Koti<br><b>English:</b> A small wooden house<br><b>Dæmi:</b> They spend the weekend at a <b>cabin</b>.", translations: { "Arabíska": "كوخ", "Portúgalska": "Cabana", "Persneska": "کلبه", "Spænska": "Cabaña", "Víetnamska": "Nhà gỗ", "Úkraínska": "Хатина", "Rússneska": "Хижина", "Pólska": "Domek letniskowy" } },
    { text: "Weather", is_exp: "<b>Íslenska:</b> Veður<br><b>English:</b> Sunny, rainy, or snowy conditions<br><b>Dæmi:</b> The <b>weather</b> is going to be cold.", translations: { "Arabíska": "طقس", "Portúgalska": "Clima", "Persneska": "آب و هوا", "Spænska": "Clima", "Víetnamska": "Thời tiết", "Úkraínska": "Погода", "Rússneska": "Погода", "Pólska": "Pogoda" } },

    { text: "Adventure", is_exp: "<b>Íslenska:</b> Ævintýri<br><b>English:</b> An exciting experience<br><b>Dæmi:</b> I think it is going to be a great <b>adventure</b>.", translations: { "Arabíska": "مغامرة", "Portúgalska": "Aventura", "Persneska": "ماجراجویی", "Spænska": "Aventura", "Víetnamska": "Cuộc phiêu lưu", "Úkraínska": "Пригода", "Rússneska": "Приключение", "Pólska": "Przygoda" } },
    { text: "Fireplace", is_exp: "<b>Íslenska:</b> Arinn<br><b>English:</b> A place to make a fire inside<br><b>Dæmi:</b> We are going to relax by the <b>fireplace</b>.", translations: { "Arabíska": "مدفأة", "Portúgalska": "Lareira", "Persneska": "شومینه", "Spænska": "Chimenea", "Víetnamska": "Lò sưởi", "Úkraínska": "Камін", "Rússneska": "Камин", "Pólska": "Kominek" } }
];

let userScores = new Array(exerciseData.length).fill(null);
let userSpoken = new Array(exerciseData.length).fill("");

let currentIndex = 0;
let recognition;
let isRecording = false;
let autoAdvanceTimer = null;
let hasDownloadedCert = false;

const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
if (SpeechRecognition) {
    recognition = new SpeechRecognition();
    recognition.lang = 'en-US';
    recognition.continuous = false;
    recognition.interimResults = false;
    
    recognition.onend = () => {
        isRecording = false;
        const btn = document.getElementById('record-btn');
        if (btn) {
            btn.innerText = "🎤 Tala (Speak)";
            btn.classList.remove('recording');
        }
        
        const resDiv = document.getElementById('result');
        if (resDiv && resDiv.innerText === "Hlusta...") {
            resDiv.innerText = "";
        }
    };
} else {
    alert("Þessi vafri styður ekki talgreiningu. Notaðu Chrome eða Edge á tölvu.");
}

window.onload = () => { 
    updateUI(); 
};

function updateProgress() {
    let correctCount = 0;
    for (let i = 0; i < userScores.length; i++) {
        if (userScores[i] === 100) {
            correctCount++;
        }
    }
    const percent = (correctCount / exerciseData.length) * 100;
    
    const progressBar = document.getElementById('progress-bar');
    if(progressBar) {
        progressBar.style.width = percent + '%';
    }
    return correctCount;
}

function updateUI() {
    clearTimeout(autoAdvanceTimer); 
    const correctCount = updateProgress();

    if (currentIndex >= exerciseData.length) {
        if (correctCount === exerciseData.length) {
            document.getElementById('app').innerHTML = `
                <div class="progress-container"><div id="progress-bar" style="width: 100%;"></div></div>
                <h1 style="color: #34a853; font-size: 2.5em;">Frábært! Þú náðir 100% árangri! 🎉</h1>
                <p style="font-size: 1.2em; color: #555;">Skrifaðu nafnið þitt hér að neðan til að sækja viðurkenningarskjalið þitt.</p>
                <input type="text" id="studentName" placeholder="Skrifaðu nafnið þitt hér" autocomplete="off" ${hasDownloadedCert ? 'disabled' : ''}><br>
                <button id="cert-btn" class="btn" style="background-color: ${hasDownloadedCert ? '#5f6368' : '#1a73e8'}; font-size: 1.5em; padding: 15px 30px; margin-top: 10px; cursor: ${hasDownloadedCert ? 'not-allowed' : 'pointer'}; opacity: ${hasDownloadedCert ? '0.7' : '1'};" onclick="downloadCert()" ${hasDownloadedCert ? 'disabled' : ''}>
                    ${hasDownloadedCert ? '✅ Skjal sótt' : '🏆 Sækja viðurkenningarskjal'}
                </button>
                <br><br>
                <button class="btn" style="background-color: #5f6368;" onclick="location.reload()">🔄 Byrja nýja umferð</button>
                <div class="feedback-note">
                    Vinsamlegast sendið ábendingar á <a href="mailto:dgu@fb.is">dgu@fb.is</a>
                </div>
            `;
        } else {
            document.getElementById('app').innerHTML = `
                <div class="progress-container"><div id="progress-bar" style="width: ${(correctCount/exerciseData.length)*100}%;"></div></div>
                <h1 style="color: #fbbc05; font-size: 2em;">Þú ert næstum því búin(n)!</h1>
                <p style="font-size: 1.2em;">Þú hefur klárað ${correctCount} af${exerciseData.length} orðum með 100% árangri.</p>
                <p style="font-size: 1.1em; color: #555;">Farðu til baka og reyndu aftur við þau orð sem vantaði upp á til að fá skjalið.</p>
                <button class="btn" style="background-color: #fbbc05; color: #000;" onclick="location.reload()">🔄 Reyna aftur</button>
                <div class="feedback-note">
                    Vinsamlegast sendið ábendingar á <a href="mailto:dgu@fb.is">dgu@fb.is</a>
                </div>
            `;
        }
        return;
    }

    const curr = exerciseData[currentIndex];

    document.getElementById('target').innerHTML = curr.text;
    document.getElementById('is-explanation').innerHTML = curr.is_exp;
    document.getElementById('counter').innerText = `Word ${currentIndex + 1} of${exerciseData.length}`;
    
    // Búa til grid fyrir þýðingarnar fyrir neðan
    let transHTML = '<div class="trans-grid">';
    for (const [lang, word] of Object.entries(curr.translations)) {
        let dir = (lang === 'Arabíska' || lang === 'Persneska') ? 'dir="rtl"' : '';
        transHTML += `
            <div class="trans-item">
                <b style="color: #555;">${lang}:</b> 
                <span ${dir} style="color: #1a73e8; font-weight: bold; margin-left: 5px;">${word}</span>
            </div>
        `;
    }
    transHTML += '</div>';
    document.getElementById('media-box').innerHTML = transHTML;

    const savedScore = userScores[currentIndex];
    const savedText = userSpoken[currentIndex];

    if (savedScore !== null) {
        document.getElementById('result').innerText = `Einkunn (Score): ${savedScore}%`;
        document.getElementById('spoken').innerText = `Þú sagðir (You said): "${savedText}"`;
    } else {
        document.getElementById('result').innerText = "";
        document.getElementById('spoken').innerText = "";
    }
}

function nextExercise() {
    currentIndex++;
    updateUI();
}

function prevExercise() {
    if (currentIndex > 0) {
        currentIndex--;
        updateUI();
    }
}

function toggleRecord() {
    if (!recognition) return;

    const btn = document.getElementById('record-btn');
    if (isRecording) {
        recognition.stop();
    } else {
        try {
            recognition.start();
            isRecording = true;
            btn.innerText = "🛑 Hlusta...";
            btn.classList.add('recording');
            document.getElementById('result').innerText = "Hlusta...";
            document.getElementById('spoken').innerText = "";
        } catch(e) {
            console.log("Villa í upptöku: " + e);
        }
    }
}

if (recognition) {
    recognition.onresult = (event) => {
        let spoken = event.results[0][0].transcript;
        spoken = spoken.trim().toLowerCase(); 

        document.getElementById('spoken').innerText = `Þú sagðir: "${spoken}"`;
        
        const targetWord = exerciseData[currentIndex].text.toLowerCase();
        
        let score = (spoken === targetWord) ? 100 : 0;
        
        if (spoken.replace(/[.,/#!$%^&*;:{}=\-_`~()]/g,"").trim() === targetWord) {
            score = 100;
        }
        
        document.getElementById('result').innerText = `Einkunn: ${score}%`;

        userScores[currentIndex] = score;
        userSpoken[currentIndex] = spoken;
        
        updateProgress();

        if (score === 100) {
            autoAdvanceTimer = setTimeout(() => {
                nextExercise();
            }, 1000); 
        }
    };
}

function downloadCert() {
    if (hasDownloadedCert) return; 

    const studentNameInput = document.getElementById('studentName');
    const studentName = studentNameInput ? studentNameInput.value.trim() : "";
    
    if (studentName === "") {
        alert("Vinsamlegast skrifaðu nafnið þitt fyrst!");
        return;
    }

    const canvas = document.createElement('canvas');
    canvas.width = 900;
    canvas.height = 600;
    const ctx = canvas.getContext('2d');
    
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    
    ctx.strokeStyle = '#1a73e8';
    ctx.lineWidth = 15;
    ctx.strokeRect(20, 20, canvas.width - 40, canvas.height - 40);

    ctx.strokeStyle = '#fbbc05';
    ctx.lineWidth = 5;
    ctx.strokeRect(40, 40, canvas.width - 80, canvas.height - 80);
    
    ctx.fillStyle = '#1a73e8';
    ctx.textAlign = 'center';
    ctx.font = 'bold 50px Arial';
    ctx.fillText('Certificate of Completion', canvas.width / 2, 140);
    
    ctx.fillStyle = '#333333';
    ctx.font = '24px Arial';
    ctx.fillText('Þetta skjal staðfestir að / This certifies that', canvas.width / 2, 220);
    
    ctx.fillStyle = '#000000';
    ctx.font = 'bold 45px Arial';
    ctx.fillText(studentName, canvas.width / 2, 290);
    
    ctx.fillStyle = '#333333';
    ctx.font = '24px Arial';
    ctx.fillText('hefur lokið framburðaræfingunni fyrir:', canvas.width / 2, 360);

    ctx.fillStyle = '#1a73e8';
    ctx.font = 'bold 26px Arial';
    ctx.fillText('Target Words - Worksheet 13', canvas.width / 2, 420);
    
    ctx.fillStyle = '#34a853';
    ctx.font = 'italic 28px Arial';
    ctx.fillText('Frábær árangur! Excellent work!', canvas.width / 2, 490);

    const dateString = new Date().toLocaleDateString('is-IS');
    ctx.fillStyle = '#666666';
    ctx.font = '18px Arial';
    ctx.fillText('Dagsetning: ' + dateString, canvas.width / 2, 540);
    
    const link = document.createElement('a');
    link.download = `Vidurkenning_Worksheet13_${studentName.replace(/\s+/g, '_')}.png`;
    link.href = canvas.toDataURL('image/png');
    link.click();
    
    hasDownloadedCert = true;
    const btn = document.getElementById('cert-btn');
    if (btn) {
        btn.disabled = true;
        btn.innerText = "✅ Skjal sótt";
        btn.style.backgroundColor = "#5f6368";
        btn.style.cursor = "not-allowed";
        btn.style.opacity = "0.7";
    }
    if (studentNameInput) {
        studentNameInput.disabled = true;
    }
}
</script>
